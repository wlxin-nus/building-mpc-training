name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.13"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install the project and development tools
        run: uv sync --frozen --extra dev

      - name: Run the test suite
        run: uv run --no-sync pytest

      - name: Run Ruff linting
        run: uv run --no-sync ruff check .

      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --check .

      - name: Run strict type checking
        run: uv run --no-sync mypy --strict src/h3c src/h3c_baselines

      - name: Build the source and wheel distributions
        run: uv build --no-sources

      - name: Verify the repository checksum manifest
        run: uv run --no-sync python scripts/verify_checksums.py

      - name: Verify the bundled frozen MPC suite
        run: >-
          uv run --no-sync building-mpc verify-frozen-suite
          --mpc-release
          models/mpc_releases/b89a2138daa2e32867768125ee84cf607927ef615c5f42065487c11b5d9e635c
